<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento - ESF Flor do Cerrado</title>
<style>
  :root { --verde-escuro: #0F4B3D; --verde-claro: #B7D34A; }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f4; margin: 0; padding: 0 0 40px 0; color: #222; }
  header { background: var(--verde-escuro); color: #fff; padding: 16px; text-align: center; }
  header h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 4px 0 0; font-size: 0.82rem; opacity: 0.85; }
  nav { display: flex; justify-content: center; gap: 10px; padding: 8px; background: #0c3b30; }
  nav a { color: #fff; font-size: 0.8rem; text-decoration: none; opacity: 0.85; }
  nav a.ativo { opacity: 1; font-weight: 700; text-decoration: underline; }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 12px 0 4px; color: var(--verde-escuro); }
  input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
  button { width: 100%; background: var(--verde-escuro); color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600; margin-top: 16px; }
  button.secundario { background: #6b7d78; }
  button:active { opacity: 0.85; }
  #msg, #msgAt, #msgDtpa, #msgExame { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 0.9rem; display: none; }
  #msg.ok, #msgAt.ok, #msgDtpa.ok, #msgExame.ok { background: #e3f3e1; color: #1e5c1c; display: block; }
  #msg.erro, #msgAt.erro, #msgDtpa.erro, #msgExame.erro { background: #fbe3e3; color: #8a1c1c; display: block; }
  .resultado-item { padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; margin-top: 8px; cursor: pointer; }
  .resultado-item:active { background: #f0f0f0; }
  .resultado-item b { color: var(--verde-escuro); }
  .ficha-linha { font-size: 0.9rem; margin: 4px 0; }
  .ficha-linha b { color: var(--verde-escuro); }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .badge.compareceu { background: #e3f3e1; color: #1e5c1c; }
  .badge.faltou { background: #fbe3e3; color: #8a1c1c; }
  .badge.agendado { background: #fff6da; color: #8a6d1c; }
  .badge.reagendado { background: #e0eefb; color: #1c4c8a; }
  .hist-item { border-bottom: 1px solid #eee; padding: 8px 0; font-size: 0.85rem; }
  .check-exame { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
  .check-exame input[type="checkbox"] { width: auto; }
  .check-exame.ja-registrado { color: #999; }
  .check-exame .tag-registrado { font-size: 0.72rem; color: #1e5c1c; margin-left: 4px; }
  #selecionarTodos { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 6px 0; }
  #selecionarTodos input { width: auto; }
  #painelGestante { display: none; }
</style>
</head>
<body>

<header>
  <h1>Registro de Atendimento</h1>
  <p>ESF Flor do Cerrado</p>
</header>
<nav>
  <a href="index.html">Cadastro</a>
  <a href="atendimento.html" class="ativo">Atendimento</a>
  <a href="relatorios.html">Relatórios</a>
</nav>

<div class="container">

  <div class="card">
    <label>Buscar gestante (nome ou ID)</label>
    <input type="text" id="busca" placeholder="Digite o nome ou G-0001">
    <button id="btnBuscar">Buscar</button>
    <div id="msg"></div>
    <div id="resultados"></div>
  </div>

  <div class="card" id="painelGestante">
    <div id="fichaGestante"></div>
    <div id="historico"></div>
    <div style="margin-top:14px; padding-top:10px; border-top:1px solid #eee;">
      <label>Registrar exames</label>
      <select id="TRIMESTRE_EXAME"><option value="">Selecione o trimestre...</option></select>
      <div id="listaCheckExames" style="margin-top:8px;"></div>
      <label>Data de solicitação (emissão)</label>
      <input type="date" id="DATA_SOLICITADO">
      <label>Data de realização (coleta)</label>
      <input type="date" id="DATA_REALIZADO">
      <button id="btnExame" class="secundario" type="button">Registrar exames selecionados</button>
      <div id="msgExame"></div>
      <div id="historicoExames" style="margin-top:10px;"></div>
    </div>
    <div style="margin-top:14px; padding-top:10px; border-top:1px solid #eee;">
      <label>Registrar vacina DTPA</label>
      <input type="date" id="DATA_DTPA">
      <button id="btnDtpa" class="secundario" type="button">Registrar DTPA</button>
      <div id="msgDtpa"></div>
    </div>
  </div>

  <div class="card" id="painelForm" style="display:none;">
    <form id="formAtendimento">
      <label>Tipo de atendimento</label>
      <select id="TIPO" required>
        <option value="">Selecione...</option>
        <option>Médica</option>
        <option>Enfermeira</option>
        <option>Odonto</option>
        <option>ACS - Gestação</option>
        <option>ACS - Puerpério</option>
        <option>Puerpério (1ª consulta)</option>
      </select>

      <label>Data agendada</label>
      <input type="date" id="DATA_AGENDADA">

      <label>Data realizada</label>
      <input type="date" id="DATA_REALIZADA">

      <label>Status</label>
      <select id="STATUS">
        <option>Agendado</option>
        <option>Compareceu</option>
        <option>Faltou</option>
        <option>Reagendado</option>
      </select>

      <label>Profissional</label>
      <input type="text" id="PROFISSIONAL">

      <label>Pressão arterial</label>
      <input type="text" id="PRESSAO_ARTERIAL" placeholder="ex.: 110/70">

      <label>Peso (kg)</label>
      <input type="text" id="PESO">

      <label>Altura (m)</label>
      <input type="text" id="ALTURA">

      <label>Observações</label>
      <textarea id="OBSERVACOES" rows="2"></textarea>

      <button type="submit">Registrar atendimento</button>
    </form>
    <div id="msgAt"></div>
  </div>

</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxkxt0KzOTbyc9CSMb_N7Y7HpCkyDc5QAPoahvtYDC-YwL-zHLtrF3HCBVIiWCZcyyoWg/exec';
  const ACCESS_KEY = 'FC_GEST2026';

  let gestanteAtual = null;

  // Converte AAAA-MM-DD (ou vazio) para DD/MM/AAAA, só para exibição
  function formatarDataBR(iso) {
    if (!iso) return '-';
    const partes = String(iso).split('T')[0].split('-');
    if (partes.length !== 3) return iso;
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  function badgeClasse(status) {
    const s = (status || '').toLowerCase();
    if (s === 'compareceu') return 'compareceu';
    if (s === 'faltou') return 'faltou';
    if (s === 'reagendado') return 'reagendado';
    return 'agendado';
  }

  document.getElementById('btnBuscar').addEventListener('click', function () {
    const termo = document.getElementById('busca').value.trim().toLowerCase();
    const msg = document.getElementById('msg');
    const resultados = document.getElementById('resultados');
    resultados.innerHTML = '';
    msg.style.display = 'none';
    if (!termo) return;

    fetch(`${API_URL}?action=listar&key=${ACCESS_KEY}`)
      .then(r => r.json())
      .then(lista => {
        const achados = lista.filter(g =>
          (g.NOME || '').toLowerCase().includes(termo) ||
          (g.ID_GESTANTE || '').toLowerCase().includes(termo)
        );
        if (!achados.length) {
          msg.textContent = 'Nenhuma gestante encontrada.';
          msg.className = 'erro';
          return;
        }
        achados.forEach(g => {
          const div = document.createElement('div');
          div.className = 'resultado-item';
          div.innerHTML = `<b>${g.NOME}</b><br>${g.ID_GESTANTE} — IG: ${g.IG_ATUAL_SEMANAS ?? '-'} semanas`;
          div.addEventListener('click', () => selecionarGestante(g));
          resultados.appendChild(div);
        });
      })
      .catch(() => {
        msg.textContent = 'Erro de conexão com o servidor.';
        msg.className = 'erro';
      });
  });

  function selecionarGestante(g) {
    gestanteAtual = g;
    document.getElementById('resultados').innerHTML = '';
    document.getElementById('busca').value = '';
    document.getElementById('painelGestante').style.display = 'block';
    document.getElementById('painelForm').style.display = 'block';

    document.getElementById('fichaGestante').innerHTML = `
      <div class="ficha-linha"><b>${g.NOME}</b> (${g.ID_GESTANTE})</div>
      <div class="ficha-linha">IG atual: <b>${g.IG_ATUAL_SEMANAS ?? '-'}</b> semanas</div>
      <div class="ficha-linha">DPP: <b>${formatarDataBR(g.DPP)}</b></div>
      <div class="ficha-linha">Próxima consulta sugerida: <b>${formatarDataBR(g.PROXIMA_CONSULTA_SUGERIDA)}</b></div>
      <div class="ficha-linha">ACS: <b>${g.AGENTE_SAUDE || '-'}</b> (microárea ${g.MICROAREA || '-'})</div>
    `;

    carregarHistorico(g.ID_GESTANTE);
    carregarHistoricoExames(g.ID_GESTANTE);
  }

  function carregarHistorico(idGestante) {
    const historico = document.getElementById('historico');
    historico.innerHTML = '<div class="ficha-linha">Carregando histórico...</div>';
    fetch(`${API_URL}?action=atendimentos_listar&idGestante=${idGestante}&key=${ACCESS_KEY}`)
      .then(r => r.json())
      .then(lista => {
        if (!lista.length) {
          historico.innerHTML = '<div class="ficha-linha">Nenhum atendimento registrado ainda.</div>';
          return;
        }
        historico.innerHTML = '<div class="ficha-linha" style="margin-top:10px;"><b>Histórico</b></div>' +
          lista.map(a => `
            <div class="hist-item">
              ${a.TIPO} — ${formatarDataBR(a.DATA_AGENDADA)}
              <span class="badge ${badgeClasse(a.STATUS)}">${a.STATUS || 'Agendado'}</span>
            </div>
          `).join('');
      })
      .catch(() => { historico.innerHTML = '<div class="ficha-linha">Erro ao carregar histórico.</div>'; });
  }

  let examesPadrao = []; // [{TRIMESTRE, EXAME}]
  let examesJaRegistrados = []; // nomes de exames já registrados no trimestre atual, para essa gestante

  fetch(`${API_URL}?action=exames_padrao&key=${ACCESS_KEY}`)
    .then(r => r.json())
    .then(lista => {
      examesPadrao = lista;
      const selTrimestre = document.getElementById('TRIMESTRE_EXAME');
      [1, 2, 3].forEach(t => selTrimestre.innerHTML += `<option value="${t}">${t}º trimestre</option>`);
    })
    .catch(() => {});

  document.getElementById('TRIMESTRE_EXAME').addEventListener('change', async function () {
    const trimestre = this.value;
    const container = document.getElementById('listaCheckExames');
    container.innerHTML = '';
    if (!trimestre || !gestanteAtual) return;

    // busca o que já foi registrado nesse trimestre, pra não deixar marcar de novo
    const todos = await fetch(`${API_URL}?action=exames_listar&idGestante=${gestanteAtual.ID_GESTANTE}&key=${ACCESS_KEY}`).then(r => r.json());
    examesJaRegistrados = todos.filter(ex => String(ex.TRIMESTRE) === trimestre).map(ex => ex.EXAME);

    const exames = examesPadrao.filter(ex => String(ex.TRIMESTRE) === trimestre);

    container.innerHTML = `
      <label id="selecionarTodos"><input type="checkbox" id="checkTodos"> Selecionar todos</label>
      ${exames.map((ex, i) => {
        const jaTem = examesJaRegistrados.indexOf(ex.EXAME) !== -1;
        return `
          <label class="check-exame ${jaTem ? 'ja-registrado' : ''}">
            <input type="checkbox" class="check-exame-item" value="${ex.EXAME}" ${jaTem ? 'disabled' : ''}>
            ${ex.EXAME} ${jaTem ? '<span class="tag-registrado">(já registrado)</span>' : ''}
          </label>
        `;
      }).join('')}
    `;

    document.getElementById('checkTodos').addEventListener('change', function () {
      document.querySelectorAll('.check-exame-item:not(:disabled)').forEach(cb => { cb.checked = this.checked; });
    });
  });

  function carregarHistoricoExames(idGestante) {
    const div = document.getElementById('historicoExames');
    fetch(`${API_URL}?action=exames_listar&idGestante=${idGestante}&key=${ACCESS_KEY}`)
      .then(r => r.json())
      .then(lista => {
        if (!lista.length) { div.innerHTML = '<div class="ficha-linha">Nenhum exame registrado ainda.</div>'; return; }
        div.innerHTML = '<div class="ficha-linha"><b>Exames registrados</b></div>' +
          lista.map(ex => `
            <div class="hist-item">
              ${ex.TRIMESTRE}º tri — ${ex.EXAME}<br>
              <span style="color:#888;">solicitado: ${formatarDataBR(ex.DATA_SOLICITADO)} — realizado: ${formatarDataBR(ex.DATA_REALIZADO)}</span>
            </div>
          `).join('');
      })
      .catch(() => { div.innerHTML = 'Erro ao carregar exames.'; });
  }

  document.getElementById('btnExame').addEventListener('click', function () {
    if (!gestanteAtual) return;
    const msgExame = document.getElementById('msgExame');
    const trimestre = document.getElementById('TRIMESTRE_EXAME').value;
    const selecionados = Array.from(document.querySelectorAll('.check-exame-item:checked')).map(cb => cb.value);

    if (!trimestre || !selecionados.length) {
      msgExame.textContent = 'Selecione o trimestre e ao menos um exame.';
      msgExame.className = 'erro';
      return;
    }

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'exames_cadastrar_lote', key: ACCESS_KEY,
        dados: {
          ID_GESTANTE: gestanteAtual.ID_GESTANTE,
          TRIMESTRE: trimestre,
          EXAMES: selecionados,
          DATA_SOLICITADO: document.getElementById('DATA_SOLICITADO').value,
          DATA_REALIZADO: document.getElementById('DATA_REALIZADO').value
        }
      })
    })
      .then(r => r.json())
      .then(res => {
        if (res.sucesso) {
          msgExame.textContent = `${res.total} exame(s) registrado(s)!`;
          msgExame.className = 'ok';
          document.getElementById('DATA_SOLICITADO').value = '';
          document.getElementById('DATA_REALIZADO').value = '';
          document.getElementById('TRIMESTRE_EXAME').dispatchEvent(new Event('change'));
          carregarHistoricoExames(gestanteAtual.ID_GESTANTE);
        } else {
          msgExame.textContent = 'Erro: ' + (res.erro || 'falha desconhecida');
          msgExame.className = 'erro';
        }
      })
      .catch(() => { msgExame.textContent = 'Erro de conexão.'; msgExame.className = 'erro'; });
  });

  document.getElementById('btnDtpa').addEventListener('click', function () {
    if (!gestanteAtual) return;
    const msgDtpa = document.getElementById('msgDtpa');
    const data = document.getElementById('DATA_DTPA').value;
    if (!data) { msgDtpa.textContent = 'Informe a data.'; msgDtpa.className = 'erro'; return; }

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'vacina_cadastrar', key: ACCESS_KEY,
        dados: { ID_GESTANTE: gestanteAtual.ID_GESTANTE, VACINA: 'DTPA', DATA_APLICADA: data }
      })
    })
      .then(r => r.json())
      .then(res => {
        if (res.sucesso) {
          msgDtpa.textContent = 'Vacina DTPA registrada!';
          msgDtpa.className = 'ok';
          document.getElementById('DATA_DTPA').value = '';
        } else {
          msgDtpa.textContent = 'Erro: ' + (res.erro || 'falha desconhecida');
          msgDtpa.className = 'erro';
        }
      })
      .catch(() => { msgDtpa.textContent = 'Erro de conexão.'; msgDtpa.className = 'erro'; });
  });

  document.getElementById('formAtendimento').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!gestanteAtual) return;
    const msgAt = document.getElementById('msgAt');
    msgAt.style.display = 'none';

    const dados = {
      ID_GESTANTE: gestanteAtual.ID_GESTANTE,
      TIPO: document.getElementById('TIPO').value,
      DATA_AGENDADA: document.getElementById('DATA_AGENDADA').value,
      DATA_REALIZADA: document.getElementById('DATA_REALIZADA').value,
      STATUS: document.getElementById('STATUS').value,
      PROFISSIONAL: document.getElementById('PROFISSIONAL').value,
      PRESSAO_ARTERIAL: document.getElementById('PRESSAO_ARTERIAL').value,
      PESO: document.getElementById('PESO').value,
      ALTURA: document.getElementById('ALTURA').value,
      OBSERVACOES: document.getElementById('OBSERVACOES').value
    };

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'atendimento_cadastrar', key: ACCESS_KEY, dados: dados })
    })
      .then(r => r.json())
      .then(res => {
        if (res.sucesso) {
          msgAt.textContent = 'Atendimento registrado! ID: ' + res.id;
          msgAt.className = 'ok';
          document.getElementById('formAtendimento').reset();
          carregarHistorico(gestanteAtual.ID_GESTANTE);
        } else {
          msgAt.textContent = 'Erro: ' + (res.erro || 'falha desconhecida');
          msgAt.className = 'erro';
        }
      })
      .catch(() => {
        msgAt.textContent = 'Erro de conexão com o servidor.';
        msgAt.className = 'erro';
      });
  });
</script>

</body>
</html>
