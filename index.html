<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Gestantes - ESF Flor do Cerrado</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0F4B3D">
<style>
  :root {
    --verde-escuro: #0F4B3D;
    --verde-claro: #B7D34A;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f4;
    margin: 0;
    padding: 0 0 40px 0;
    color: #222;
  }
  header {
    background: var(--verde-escuro);
    color: #fff;
    padding: 18px 16px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.2rem; }
  header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.85; }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  nav { display: flex; justify-content: center; gap: 10px; padding: 8px; background: #0c3b30; }
  nav a { color: #fff; font-size: 0.8rem; text-decoration: none; opacity: 0.85; }
  nav a.ativo { opacity: 1; font-weight: 700; text-decoration: underline; }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 12px 0 4px;
    color: var(--verde-escuro);
  }
  input, select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
  }
  button {
    width: 100%;
    background: var(--verde-escuro);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    margin-top: 20px;
  }
  button:active { opacity: 0.85; }
  #msg {
    margin-top: 14px;
    padding: 10px;
    border-radius: 6px;
    font-size: 0.9rem;
    display: none;
  }
  #msg.ok { background: #e3f3e1; color: #1e5c1c; display: block; }
  #msg.erro { background: #fbe3e3; color: #8a1c1c; display: block; }
  .hint { font-size: 0.75rem; color: #777; margin-top: 2px; }
</style>
</head>
<body>

<header>
  <h1>Cadastro de Gestante</h1>
  <p>ESF Flor do Cerrado</p>
</header>
<nav>
  <a href="index.html" class="ativo">Cadastro</a>
  <a href="atendimento.html">Atendimento</a>
  <a href="relatorios.html">Relatórios</a>
</nav>

<div class="container">
  <div class="card">
    <label>Importar do Protocolo de Solicitação de Agendamento (PDF)</label>
    <input type="file" id="arquivoPDF" accept="application/pdf">
    <div class="hint">Use só na abertura do pré-natal (documento "1ª vez"). Depois de cadastrada, use o nome ou o código G-000X.</div>
    <div id="msgImportar"></div>
  </div>

  <div class="card">
    <form id="formCadastro">
      <label>Nome completo</label>
      <input type="text" id="NOME" required>

      <label>CNS (Cartão Nacional de Saúde)</label>
      <input type="text" id="CNS">

      <label>Data de nascimento</label>
      <input type="date" id="DATA_NASCIMENTO">

      <label>Microárea</label>
      <input type="text" id="MICROAREA" list="listaMicroareas" autocomplete="off">
      <datalist id="listaMicroareas"></datalist>

      <label>Agente de saúde responsável</label>
      <input type="text" id="AGENTE_SAUDE" list="listaACS" autocomplete="off">
      <datalist id="listaACS"></datalist>

      <label>Contato (telefone)</label>
      <input type="tel" id="CONTATO" placeholder="(65) 9xxxx-xxxx">

      <label>DUM (data da última menstruação)</label>
      <input type="date" id="DUM">
      <div class="hint">A data provável do parto (DPP) é calculada automaticamente.</div>

      <label>Data de abertura do pré-natal</label>
      <input type="date" id="DATA_ABERTURA_PRENATAL">

      <label>Status</label>
      <select id="STATUS">
        <option value="Ativa">Ativa</option>
        <option value="Puerpério">Puerpério</option>
        <option value="Encerrada">Encerrada</option>
        <option value="Transferida">Transferida</option>
      </select>

      <label>Observações</label>
      <textarea id="OBSERVACOES" rows="3"></textarea>

      <button type="submit">Cadastrar gestante</button>
    </form>
    <div id="msg"></div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxkxt0KzOTbyc9CSMb_N7Y7HpCkyDc5QAPoahvtYDC-YwL-zHLtrF3HCBVIiWCZcyyoWg/exec';
  const ACCESS_KEY = 'FC_GEST2026'; // igual ao Code.gs

  document.getElementById('arquivoPDF').addEventListener('change', function () {
    const arquivo = this.files[0];
    const msg = document.getElementById('msgImportar');
    if (!arquivo) return;

    msg.textContent = 'Lendo o PDF, aguarde...';
    msg.className = 'ok';

    const leitor = new FileReader();
    leitor.onload = function () {
      const base64 = leitor.result.split(',')[1];

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'extrair_pdf', key: ACCESS_KEY, pdfBase64: base64 })
      })
        .then(r => r.json())
        .then(res => {
          if (!res.sucesso) {
            msg.textContent = 'Erro: ' + (res.erro || 'falha desconhecida');
            msg.className = 'erro';
            return;
          }
          const d = res.dados;

          if (d.TIPO_CONSULTA && d.TIPO_CONSULTA.toLowerCase().indexOf('retorno') !== -1) {
            msg.textContent = 'Atenção: este documento parece ser de RETORNO, não de 1ª vez. Confira se essa gestante já não está cadastrada antes de prosseguir.';
            msg.className = 'erro';
          } else {
            msg.textContent = 'Dados importados! Revise antes de cadastrar (DUM, microárea e ACS não vêm neste documento).';
            msg.className = 'ok';
          }

          if (d.NOME) document.getElementById('NOME').value = d.NOME;
          if (d.CNS) document.getElementById('CNS').value = d.CNS;
          if (d.DATA_NASCIMENTO) document.getElementById('DATA_NASCIMENTO').value = d.DATA_NASCIMENTO;
          if (d.CONTATO) document.getElementById('CONTATO').value = d.CONTATO;
          if (d.DATA_ABERTURA_PRENATAL_SUGERIDA) document.getElementById('DATA_ABERTURA_PRENATAL').value = d.DATA_ABERTURA_PRENATAL_SUGERIDA;
        })
        .catch(() => {
          msg.textContent = 'Erro de conexão ao extrair o PDF.';
          msg.className = 'erro';
        });
    };
    leitor.readAsDataURL(arquivo);
  });

  let listaACS = []; // [{MICROAREA, AGENTE_SAUDE}]

  // Carrega a relação ACS/microárea uma vez, ao abrir a página
  fetch(`${API_URL}?action=acs_lista&key=${ACCESS_KEY}`)
    .then(r => r.json())
    .then(lista => {
      listaACS = lista;
      const dlMicro = document.getElementById('listaMicroareas');
      const dlACS = document.getElementById('listaACS');
      const microareasUnicas = [...new Set(lista.map(r => String(r.MICROAREA)))];
      microareasUnicas.forEach(m => dlMicro.innerHTML += `<option value="${m}">`);
      lista.forEach(r => dlACS.innerHTML += `<option value="${r.AGENTE_SAUDE}">`);
    })
    .catch(() => {}); // se falhar, o usuário ainda digita manualmente

  // Ao preencher a microárea, tenta achar a ACS correspondente
  document.getElementById('MICROAREA').addEventListener('change', function () {
    const valor = this.value.trim();
    const achou = listaACS.find(r => String(r.MICROAREA).trim() === valor);
    if (achou) document.getElementById('AGENTE_SAUDE').value = achou.AGENTE_SAUDE;
  });

  // Ao preencher a ACS, tenta achar a microárea correspondente
  document.getElementById('AGENTE_SAUDE').addEventListener('change', function () {
    const valor = this.value.trim().toUpperCase();
    const achou = listaACS.find(r => String(r.AGENTE_SAUDE).trim().toUpperCase() === valor);
    if (achou) document.getElementById('MICROAREA').value = achou.MICROAREA;
  });

  document.getElementById('formCadastro').addEventListener('submit', function (e) {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.className = '';
    msg.style.display = 'none';

    const dados = {
      NOME: document.getElementById('NOME').value,
      CNS: document.getElementById('CNS').value,
      DATA_NASCIMENTO: document.getElementById('DATA_NASCIMENTO').value,
      MICROAREA: document.getElementById('MICROAREA').value,
      AGENTE_SAUDE: document.getElementById('AGENTE_SAUDE').value,
      CONTATO: document.getElementById('CONTATO').value,
      DUM: document.getElementById('DUM').value,
      DATA_ABERTURA_PRENATAL: document.getElementById('DATA_ABERTURA_PRENATAL').value,
      STATUS: document.getElementById('STATUS').value,
      OBSERVACOES: document.getElementById('OBSERVACOES').value
    };

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'cadastrar', key: ACCESS_KEY, dados: dados })
    })
      .then(r => r.json())
      .then(res => {
        if (res.sucesso) {
          msg.textContent = 'Cadastrada com sucesso! ID: ' + res.id + (res.dpp ? ' — DPP: ' + res.dpp : '');
          msg.className = 'ok';
          document.getElementById('formCadastro').reset();
          document.getElementById('arquivoPDF').value = '';
          document.getElementById('msgImportar').textContent = '';
          document.getElementById('msgImportar').className = '';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          msg.textContent = 'Erro: ' + (res.erro || 'falha desconhecida');
          msg.className = 'erro';
        }
      })
      .catch(() => {
        msg.textContent = 'Erro de conexão com o servidor.';
        msg.className = 'erro';
      });
  });
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
